[project]
name = "classifier-training"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "coremltools==9.0; sys_platform == 'darwin'",
  "numpy>=1.26",
  "pillow>=10",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
